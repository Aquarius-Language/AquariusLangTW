<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquariusLang</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; }
  #surfaces { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #surfaces canvas { max-width: 100%; max-height: 100%; outline: none; }
  #output { margin: 0; padding: 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; position: relative; }
  /* Errors (standard error, or the application stopping) in a panel over the bottom of the page, never mixed into
     the application's own drawing. */
  #error { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 40vh; overflow: auto; z-index: 1;
    box-sizing: border-box; padding: 10px 14px; border: 1px solid #ff8a80; border-radius: 8px; background: #2a1414f2;
    color: #ffb4ab; font: 13px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
  /* Empty, they take no room over the windows (which would lose the pointer there). */
  #output:empty, #error:empty { display: none; }
</style>
</head>
<body>
<div id="surfaces"></div>
<pre id="output"></pre>
<div id="error"></div>
<script type="module" src="app.mjs"></script>
</body>
</html>
