<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquarius WebAssembly</title>
<link rel="icon" href="data:,">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c1624;color:#e5eff7;font:15px system-ui}
#surfaces{position:fixed;inset:0}
#surfaces canvas{display:block;width:100%;height:100%;outline:none}
#output{position:fixed;inset:0;margin:0;padding:16px;overflow:auto;white-space:pre-wrap}
body:has(#surfaces canvas) #output{display:none}
#error{position:fixed;inset:16px auto auto 16px;max-width:calc(100% - 64px);padding:16px;background:#203446;white-space:pre-wrap}
</style>
<main id="surfaces"></main>
<pre id="output" aria-live="polite"></pre>
<div id="error" role="alert" hidden></div>
<script type="module" src="app.mjs"></script>
</html>
