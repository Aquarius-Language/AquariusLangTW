manifest_version = 2

[library]
name = "saturn"
version = "1.0.0"
description = "Saturn/土星: Yoga flexbox and grid layout trees with styles, text, painting into the UI draw list and hit testing (Saturn), and the Flutter-style SaturnUI widgets on top; render-agnostic, for any graphics library or offscreen."
license = "MIT"
platforms = ["windows", "linux", "android", "web"]

[native]
modules = ["Saturn|土星"]
[[modules]]
names = "SaturnUI|土星介面"
source = "aqua/SaturnUI.aqua"
