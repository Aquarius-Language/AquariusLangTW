name: Pinned Wasm toolchain
description: >-
  Installs the pinned LLVM/Clang toolchain (scripts/wasm-toolchain.json) and fails unless the committed runtime.wasm,
  audio.wasm, pose.wasm and geometry.wasm rebuild byte-identically from their sources. Requires Node.js (the audio check reads imports).
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .native-build/toolchains
        key: wasm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wasm-toolchain.json') }}
    - name: Reproducible Wasm binaries
      shell: pwsh
      run: |
        ./scripts/install-wasm-toolchain.ps1
        ./scripts/build-wasm-runtime.ps1 -Check
        ./scripts/build-audio-runtime.ps1 -Check
        ./scripts/build-pose-wasm.ps1 -Check
        ./scripts/build-geometry-wasm.ps1 -Check
