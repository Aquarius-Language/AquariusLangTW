name: Pinned native toolchain
description: >-
  Installs the pinned LLVM/Clang, sysroots, SDKs and (for Android targets) JDK from scripts/toolchain.json for the given
  targets, and fails unless the committed guest runtime (runtime/guest/runtime.wasm) rebuilds byte-identically.
inputs:
  targets:
    description: Comma-separated runtime targets (windows-x64, linux-x64, android-arm64-v8a, android-x86_64, web).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          .native-build/toolchains
          .native-build/sdk
        key: toolchain-${{ runner.os }}-${{ inputs.targets }}-${{ hashFiles('scripts/toolchain.json') }}
    - name: Install the toolchain and check the guest runtime
      shell: pwsh
      run: |
        ./scripts/install-toolchain.ps1 -Targets '${{ inputs.targets }}'
        ./scripts/build-wasm-runtime.ps1 -Check
