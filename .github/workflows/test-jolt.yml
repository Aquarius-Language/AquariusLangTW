name: Terminal and dynamic-library hosts
on: [push, pull_request]
jobs:
  host-capabilities:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix AquariusWebCompiler
      - run: npm run --prefix AquariusWebCompiler prepare:browser
      - run: dotnet test AquariusTests -c Release --filter "FullyQualifiedName~TerminalTest|FullyQualifiedName~DynamicLibraryTest|FullyQualifiedName~ExternalLibraryTest" --logger "trx;LogFileName=host-capabilities.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-capabilities-${{ matrix.os }}
          path: AquariusTests/TestResults/*.trx
