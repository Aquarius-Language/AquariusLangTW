name: Linux
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/toolchain
        with:
          targets: linux-x64
      - name: Window system, GPU and font libraries the runtime loads
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols libgl1-mesa-dev mesa-vulkan-drivers libpangocairo-1.0-0 fonts-noto-cjk zenity xvfb
      - name: Runtime pack, compiler and library tests with software OpenGL and Vulkan
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_RUNTIME_DIR: /tmp/aquarius-runtime
          AQUARIUS_LLVM: ${{ github.workspace }}/.native-build/toolchains/llvm-23.1.3-linux-x64
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a bash scripts/test-linux.sh
          xvfb-run -a pwsh ./scripts/test-libraries.ps1 -Targets linux-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: compiler/AquariusTests/TestResults/*.trx
