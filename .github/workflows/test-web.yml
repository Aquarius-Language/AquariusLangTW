name: Shared Wasm and browser tests
on: [push, pull_request]
jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AquariusWebCompiler/package-lock.json
      - name: Build example and marble websites
        shell: pwsh
        run: |
          ./scripts/install-wasm-toolchain.ps1
          ./scripts/build-wasm-runtime.ps1 -Check
          ./AquariusWebCompiler/scripts/build-web.ps1
      - name: Language, packaging, CLI smoke tests and browser Wasm parity
        run: dotnet test AquariusTests --no-build -m:1 --logger "trx;LogFileName=compiler.trx"
      - name: Browser validation unit tests
        run: npm test --prefix AquariusWebCompiler
      - name: Browser GPU and gameplay smoke tests
        run: node AquariusWebCompiler/tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            .web-build/browser-results.json
            .web-build/marble-*.png
            .web-build/marble-wasm-*.png
            AquariusTests/TestResults/*.trx
