name: macOS and iOS
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15   # Apple Silicon, with Xcode and iOS simulator runtimes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/toolchain
        with:
          targets: macos-arm64,ios-simulator-arm64,ios-arm64
      - name: Runtime packs (the pinned Clang against the Xcode SDKs)
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Targets macos-arm64,ios-simulator-arm64,ios-arm64
      - name: Boot an iOS simulator
        shell: pwsh
        run: |
          $device = ((xcrun simctl list devices available --json | ConvertFrom-Json).devices.PSObject.Properties.Value |
              Where-Object name -like 'iPhone*' | Select-Object -First 1)
          xcrun simctl boot $device.udid
          xcrun simctl bootstatus $device.udid -b
      - name: Compiler, packaging, CLI and architecture tests
        run: dotnet test compiler/AquariusTests -c Release -m:1 --logger 'trx;LogFileName=macos.trx'
      - name: Library tests (macOS and the iOS simulator)
        if: success() || failure()
        run: pwsh ./scripts/test-libraries.ps1 -Targets macos-arm64,ios-simulator-arm64
      - name: Simulator log and crash reports
        if: failure()
        run: |
          xcrun simctl spawn booted log show --last 30m --style compact --predicate 'process BEGINSWITH "Run" OR process BEGINSWITH "AquariusTest" OR eventMessage CONTAINS "org.aquariuslang"' | tail -n 300 || true
          ls -t ~/Library/Logs/DiagnosticReports | head -n 5 | while read -r report; do echo "== $report"; head -n 80 ~/Library/Logs/DiagnosticReports/"$report"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-test-results
          path: compiler/AquariusTests/TestResults/*.trx
