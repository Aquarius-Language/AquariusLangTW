name: Windows and web
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/toolchain
        with:
          targets: windows-x64,web
      - name: Runtime packs (Clang + MinGW, and the web side modules)
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Targets windows-x64,web
      - name: Compiler, packaging, CLI and architecture tests
        run: dotnet test compiler/AquariusTests -c Release -m:1 --logger "trx;LogFileName=windows.trx"
      - name: Library tests on Windows and in Chromium
        shell: pwsh
        run: |
          npm ci --prefix scripts
          npx --prefix scripts playwright install chromium
          ./scripts/test-libraries.ps1 -Targets windows-x64,web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: compiler/AquariusTests/TestResults/*.trx
