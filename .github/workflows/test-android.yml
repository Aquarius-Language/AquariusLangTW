name: Android
on: [push, pull_request]
jobs:
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: android-actions/setup-android@v3
      - name: Android SDK pieces pinned in scripts/toolchain.json
        shell: pwsh
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: ./.github/actions/toolchain
        with:
          targets: android-arm64-v8a,android-x86_64
      - name: Runtime packs for both ABIs
        shell: pwsh
        run: ./scripts/build-runtime.ps1 -Targets android-arm64-v8a,android-x86_64
      - name: APK build and Android packaging tests
        run: dotnet test compiler/AquariusTests -c Release -m:1 --filter "FullyQualifiedName~Android|Category=Architecture" --logger "trx;LogFileName=android.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: compiler/AquariusTests/TestResults/*.trx
