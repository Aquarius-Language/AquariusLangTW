manifest_version = 2

[project]
name = "geometry"
version = "1.2.0"
entry = "main.aqua"
sources = ["main.aqua"]

[export]
name = "geometry"
prefix = "geo_"

# The Java binding everywhere it builds, so the JNI path also runs on a desktop JVM (scripts/test-exports.ps1).
[export.windows]
bindings = ["c", "cpp", "rust", "java"]
java_package = "org.aquariuslang.tests.geometry"

[export.linux]
bindings = ["c", "cpp", "rust", "java"]
java_package = "org.aquariuslang.tests.geometry"

[export.android]
java_package = "org.aquariuslang.tests.geometry"
