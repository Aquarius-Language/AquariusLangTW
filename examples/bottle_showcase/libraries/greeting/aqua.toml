manifest_version = 1

[project]
name = "bottle_greeting"
type = "library"
version = "0.18.0"
entry = "main.aqua"
sources = ["main.aqua"]
platforms = ["windows", "linux", "web", "android"]
license = "MIT"
description = "A local library with text assets, a transitive dependency and a dynamic Wasm library."

[dependencies]
bottle_numbers = { path = "dependencies/numbers/aqua.toml", version = ">= 1.0, < 2.0" }

[[assets]]
source = "assets"

[[assets]]
source = "native/showcase.wasm"
